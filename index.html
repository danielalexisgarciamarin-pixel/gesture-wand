<script>

"use strict";


/* =========================================================
   ELEMENTOS
   ========================================================= */

const video =
  document.getElementById("video");

const stage =
  document.getElementById("stage");

const canvas =
  document.getElementById("overlay");

const ctx =
  canvas.getContext("2d");

const pointer =
  document.getElementById("pointer");

const startBtn =
  document.getElementById("startBtn");

const backgroundBtn =
  document.getElementById("backgroundBtn");

const objectBtn =
  document.getElementById("objectBtn");

const tipABtn =
  document.getElementById("tipABtn");

const tipBBtn =
  document.getElementById("tipBBtn");

const calibrationBtn =
  document.getElementById("calibrationBtn");

const capturePointBtn =
  document.getElementById("capturePointBtn");

const sensorBtn =
  document.getElementById("sensorBtn");

const resetBtn =
  document.getElementById("resetBtn");

const message =
  document.getElementById("message");

const gesture =
  document.getElementById("gesture");

const details =
  document.getElementById("details");

const sensorData =
  document.getElementById("sensorData");

const gestureName =
  document.getElementById("gestureName");

const customAction =
  document.getElementById("customAction");

const recordGestureBtn =
  document.getElementById("recordGestureBtn");

const clearGesturesBtn =
  document.getElementById("clearGesturesBtn");

const customGestureInfo =
  document.getElementById("customGestureInfo");


/* =========================================================
   ESTADO
   ========================================================= */

let stream=null;

let running=false;

let background=null;

let bgWidth=0;
let bgHeight=0;

let objectModel=null;

let selectedTip="A";

let previousEnds=null;

let previousTip=null;

let previousTime=0;

let previousAngle=null;

let lastGestureTime=0;

let homography=null;

let calibrationMode=false;

let calibrationPoints=[];

let calibrationTargetIndex=0;

let targetElement=null;

let sensorsActive=false;

let sensorState={
  ax:0,
  ay:0,
  az:0,
  alpha:0,
  beta:0,
  gamma:0
};

let customGestures=[];

let recordingGesture=false;

let recordedPath=[];

let recordingStart=0;

let lastStrokeTime=0;

let liveStroke=[];

let strokeTimer=null;


/* =========================================================
   MEMORIA
   ========================================================= */

const PROFILE_KEY =
  "gesture_wand_profile_v30";


/* =========================================================
   CANVAS DE TRABAJO
   ========================================================= */

const workCanvas =
  document.createElement("canvas");

const workCtx =
  workCanvas.getContext(
    "2d",
    {willReadFrequently:true}
  );


/* =========================================================
   UTILIDADES
   ========================================================= */

function setMessage(text){
  message.textContent=text;
}


function distance(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );
}


function angleDiff(a,b){

  let d=a-b;

  while(d>Math.PI)
    d-=Math.PI*2;

  while(d<-Math.PI)
    d+=Math.PI*2;

  return d;
}


function clamp(v,a,b){

  return Math.max(
    a,
    Math.min(b,v)
  );
}


/* =========================================================
   GUARDAR CONFIGURACIÓN
   ========================================================= */

function saveProfile(){

  try{

    const profile={

      version:"3.0",

      objectModel:objectModel,

      selectedTip:selectedTip,

      homography:homography,

      customGestures:customGestures,

      sensorsConfigured:sensorsActive

    };

    localStorage.setItem(
      PROFILE_KEY,
      JSON.stringify(profile)
    );

  }catch(err){

    console.warn(
      "No se pudo guardar perfil",
      err
    );
  }
}


/* =========================================================
   CARGAR CONFIGURACIÓN
   ========================================================= */

function loadProfile(){

  try{

    const raw=
      localStorage.getItem(
        PROFILE_KEY
      );

    if(!raw) return false;

    const profile=
      JSON.parse(raw);

    if(
      profile.objectModel
    ){

      objectModel=
        profile.objectModel;
    }

    if(
      profile.selectedTip==="A" ||
      profile.selectedTip==="B"
    ){

      selectedTip=
        profile.selectedTip;
    }

    if(
      Array.isArray(
        profile.homography
      )
    ){

      homography=
        profile.homography;
    }

    if(
      Array.isArray(
        profile.customGestures
      )
    ){

      customGestures=
        profile.customGestures;
    }

    updateTipButtons();

    updateCustomGestureInfo();

    return true;

  }catch(err){

    console.warn(
      "Error cargando perfil",
      err
    );

    return false;
  }
}


/* =========================================================
   CÁMARA
   ========================================================= */

async function startCamera(){

  if(!window.isSecureContext){

    setMessage(
      "⚠️ La cámara necesita HTTPS."
    );

    return;
  }

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    setMessage(
      "⚠️ Este navegador no permite cámara."
    );

    return;
  }

  try{

    if(stream){

      stream
        .getTracks()
        .forEach(
          t=>t.stop()
        );
    }

    stream=
      await navigator.mediaDevices
      .getUserMedia({

        video:{
          facingMode:"user",
          width:{ideal:640},
          height:{ideal:480}
        },

        audio:false
      });

    video.srcObject=stream;

    await video.play();

    running=true;

    setMessage(
      "📷 Cámara activa."
    );

    details.textContent=
      "Captura primero el fondo.";

    requestAnimationFrame(scan);

  }catch(err){

    console.error(err);

    setMessage(
      "❌ No se pudo activar la cámara."
    );

    details.textContent=
      "Revisa el permiso de cámara.";
  }
}


/* =========================================================
   FONDO
   ========================================================= */

function captureBackground(){

  if(
    !running ||
    video.readyState<2
  ){

    setMessage(
      "Primero activa la cámara."
    );

    return;
  }

  const w=180;

  const h=Math.round(
    w*
    video.videoHeight/
    video.videoWidth
  );

  workCanvas.width=w;
  workCanvas.height=h;

  workCtx.drawImage(
    video,
    0,
    0,
    w,
    h
  );

  const img=
    workCtx.getImageData(
      0,
      0,
      w,
      h
    );

  background=
    new Uint8ClampedArray(
      img.data
    );

  bgWidth=w;
  bgHeight=h;

  previousEnds=null;
  previousTip=null;

  setMessage(
    "✅ Fondo capturado."
  );

  details.textContent=
    "Coloca el objeto y pulsa «Aprender objeto».";
}


/* =========================================================
   MÁSCARA
   ========================================================= */

function createMask(){

  if(!background)
    return null;

  const w=bgWidth;
  const h=bgHeight;

  workCtx.drawImage(
    video,
    0,
    0,
    w,
    h
  );

  const img=
    workCtx.getImageData(
      0,
      0,
      w,
      h
    );

  const d=img.data;

  const mask=
    new Uint8Array(
      w*h
    );

  for(
    let y=1;
    y<h-1;
    y++
  ){

    for(
      let x=1;
      x<w-1;
      x++
    ){

      const i=
        (y*w+x)*4;

      const dr=
        Math.abs(
          d[i]-background[i]
        );

      const dg=
        Math.abs(
          d[i+1]-background[i+1]
        );

      const db=
        Math.abs(
          d[i+2]-background[i+2]
        );

      const diff=
        (dr+dg+db)/3;

      if(diff>38){

        mask[
          y*w+x
        ]=1;
      }
    }
  }

  return mask;
}


/* =========================================================
   COMPONENTES
   ========================================================= */

function findCandidates(mask){

  const w=bgWidth;
  const h=bgHeight;

  const visited=
    new Uint8Array(
      w*h
    );

  const candidates=[];

  const stack=[];

  for(
    let y=1;
    y<h-1;
    y++
  ){

    for(
      let x=1;
      x<w-1;
      x++
    ){

      const start=
        y*w+x;

      if(
        !mask[start] ||
        visited[start]
      )
        continue;

      visited[start]=1;

      stack.length=0;

      stack.push(start);

      const points=[];

      while(stack.length){

        const idx=
          stack.pop();

        const px=
          idx%w;

        const py=
          Math.floor(idx/w);

        points.push({
          x:px,
          y:py
        });

        const n1=idx-1;
        const n2=idx+1;
        const n3=idx-w;
        const n4=idx+w;

        if(
          px>0 &&
          mask[n1] &&
          !visited[n1]
        ){

          visited[n1]=1;
          stack.push(n1);
        }

        if(
          px<w-1 &&
          mask[n2] &&
          !visited[n2]
        ){

          visited[n2]=1;
          stack.push(n2);
        }

        if(
          py>0 &&
          mask[n3] &&
          !visited[n3]
        ){

          visited[n3]=1;
          stack.push(n3);
        }

        if(
          py<h-1 &&
          mask[n4] &&
          !visited[n4]
        ){

          visited[n4]=1;
          stack.push(n4);
        }
      }

      if(points.length<18)
        continue;

      if(points.length>w*h*.45)
        continue;

      const candidate=
        analyzeComponent(points);

      if(
        candidate &&
        candidate.length>18
      ){

        candidates.push(
          candidate
        );
      }
    }
  }

  return candidates;
}


/* =========================================================
   ANÁLISIS DE FORMA
   ========================================================= */

function analyzeComponent(points){

  let sx=0;
  let sy=0;

  for(const p of points){

    sx+=p.x;
    sy+=p.y;
  }

  const cx=
    sx/points.length;

  const cy=
    sy/points.length;

  let xx=0;
  let yy=0;
  let xy=0;

  for(const p of points){

    const dx=p.x-cx;
    const dy=p.y-cy;

    xx+=dx*dx;
    yy+=dy*dy;
    xy+=dx*dy;
  }

  xx/=points.length;
  yy/=points.length;
  xy/=points.length;

  const theta=
    .5*Math.atan2(
      2*xy,
      xx-yy
    );

  const ux=Math.cos(theta);
  const uy=Math.sin(theta);

  let minProj=Infinity;
  let maxProj=-Infinity;

  for(const p of points){

    const projection=
      (p.x-cx)*ux+
      (p.y-cy)*uy;

    minProj=
      Math.min(
        minProj,
        projection
      );

    maxProj=
      Math.max(
        maxProj,
        projection
      );
  }

  const length=
    maxProj-minProj;

  if(length<18)
    return null;

  const endBand=
    Math.max(
      3,
      length*.12
    );

  let ax=0;
  let ay=0;
  let ac=0;

  let bx=0;
  let by=0;
  let bc=0;

  let perpSum=0;

  for(const p of points){

    const projection=
      (p.x-cx)*ux+
      (p.y-cy)*uy;

    const perp=
      (p.x-cx)*(-uy)+
      (p.y-cy)*ux;

    perpSum+=perp*perp;

    if(
      projection<=
      minProj+endBand
    ){

      ax+=p.x;
      ay+=p.y;
      ac++;
    }

    if(
      projection>=
      maxProj-endBand
    ){

      bx+=p.x;
      by+=p.y;
      bc++;
    }
  }

  if(!ac || !bc)
    return null;

  const A={
    x:ax/ac,
    y:ay/ac
  };

  const B={
    x:bx/bc,
    y:by/bc
  };

  const thickness=
    Math.max(
      2,
      2*Math.sqrt(
        perpSum/points.length
      )
    );

  const aspect=
    length/thickness;

  if(aspect<1.45)
    return null;

  return{

    center:{
      x:cx,
      y:cy
    },

    A:A,
    B:B,

    length:length,

    thickness:thickness,

    aspect:aspect,

    area:points.length,

    angle:theta,

    score:
      aspect*
      Math.sqrt(
        points.length
      )
  };
}


/* =========================================================
   ELEGIR OBJETO
   ========================================================= */

function chooseCandidate(candidates){

  if(!candidates.length)
    return null;

  let best=null;

  let bestScore=-Infinity;

  for(const c of candidates){

    let score=c.score;

    if(objectModel){

      const lengthRatio=
        Math.min(
          c.length/objectModel.length,
          objectModel.length/c.length
        );

      const aspectRatio=
        Math.min(
          c.aspect/objectModel.aspect,
          objectModel.aspect/c.aspect
        );

      score*=
        .5+
        .5*lengthRatio;

      score*=
        .65+
        .35*aspectRatio;
    }

    if(previousEnds){

      const centerDist=
        distance(
          c.center,
          previousEnds.center
        );

      score*=
        1/
        (1+centerDist/90);
    }

    if(score>bestScore){

      bestScore=score;
      best=c;
    }
  }

  return best;
}


/* =========================================================
   COORDENADAS
   ========================================================= */

function toScreen(p){

  const rect=
    canvas.getBoundingClientRect();

  return{

    x:
      rect.width-
      (p.x/bgWidth)*
      rect.width,

    y:
      (p.y/bgHeight)*
      rect.height
  };
}


/* =========================================================
   EXTREMOS ESTABLES
   ========================================================= */

function stabilizeEnds(candidate){

  let A=
    toScreen(
      candidate.A
    );

  let B=
    toScreen(
      candidate.B
    );

  if(previousEnds){

    const normal=
      distance(
        A,
        previousEnds.A
      )+
      distance(
        B,
        previousEnds.B
      );

    const swapped=
      distance(
        A,
        previousEnds.B
      )+
      distance(
        B,
        previousEnds.A
      );

    if(swapped<normal){

      const temp=A;
      A=B;
      B=temp;
    }
  }

  return{

    A:A,
    B:B,

    center:
      toScreen(
        candidate.center
      )
  };
}


/* =========================================================
   APRENDER OBJETO
   ========================================================= */

function captureObject(){

  if(!background){

    setMessage(
      "Primero captura el fondo."
    );

    return;
  }

  const mask=
    createMask();

  const candidates=
    findCandidates(mask);

  const candidate=
    chooseCandidate(
      candidates
    );

  if(!candidate){

    setMessage(
      "❌ No encuentro el objeto."
    );

    details.textContent=
      "Usa un objeto alargado y evita que se mezcle con el fondo.";

    return;
  }

  objectModel={

    length:
      candidate.length,

    aspect:
      candidate.aspect,

    area:
      candidate.area
  };

  previousEnds=null;
  previousTip=null;

  saveProfile();

  setMessage(
    "✅ Objeto aprendido y guardado."
  );

  details.textContent=
    "El objeto ya forma parte del perfil de Gesture Wand.";
}


/* =========================================================
   PUNTAS
   ========================================================= */

function updateTipButtons(){

  tipABtn.style.outline=
    selectedTip==="A"
    ? "2px solid white"
    : "none";

  tipBBtn.style.outline=
    selectedTip==="B"
    ? "2px solid white"
    : "none";
}


function selectTip(tip){

  if(!objectModel){

    setMessage(
      "Primero aprende el objeto."
    );

    return;
  }

  selectedTip=tip;

  previousTip=null;
  previousAngle=null;

  updateTipButtons();

  saveProfile();

  setMessage(
    "🎯 Punta "+tip+" seleccionada."
  );
}


/* =========================================================
   HOMOGRAFÍA
   ========================================================= */

function solveLinear(A,b){

  const n=b.length;

  const M=
    A.map(
      (row,i)=>
        row.slice().concat(
          b[i]
        )
    );

  for(
    let c=0;
    c<n;
    c++
  ){

    let pivot=c;

    for(
      let r=c+1;
      r<n;
      r++
    ){

      if(
        Math.abs(
          M[r][c]
        )>
        Math.abs(
          M[pivot][c]
        )
      ){

        pivot=r;
      }
    }

    if(
      Math.abs(
        M[pivot][c]
      )<1e-10
    ){

      return null;
    }

    [
      M[c],
      M[pivot]
    ]=[
      M[pivot],
      M[c]
    ];

    const divisor=
      M[c][c];

    for(
      let j=c;
      j<=n;
      j++
    ){

      M[c][j]/=
        divisor;
    }

    for(
      let r=0;
      r<n;
      r++
    ){

      if(r===c)
        continue;

      const factor=
        M[r][c];

      for(
        let j=c;
        j<=n;
        j++
      ){

        M[r][j]-=
          factor*
          M[c][j];
      }
    }
  }

  return M.map(
    row=>row[n]
  );
}


function fitHomography(
  src,
  dst
){

  const A=[];
  const b=[];

  for(
    let i=0;
    i<src.length;
    i++
  ){

    const x=src[i].x;
    const y=src[i].y;

    const X=dst[i].x;
    const Y=dst[i].y;

    A.push([
      x,y,1,
      0,0,0,
      -X*x,
      -X*y
    ]);

    b.push(X);

    A.push([
      0,0,0,
      x,y,1,
      -Y*x,
      -Y*y
    ]);

    b.push(Y);
  }

  /*
   * Mínimos cuadrados:
   * H=(AᵀA)^-1 Aᵀb
   */

  const AtA=
    Array.from(
      {length:8},
      ()=>Array(8).fill(0)
    );

  const Atb=
    Array(8).fill(0);

  for(
    let i=0;
    i<A.length;
    i++
  ){

    for(
      let j=0;
      j<8;
      j++
    ){

      Atb[j]+=
        A[i][j]*
        b[i];

      for(
        let k=0;
        k<8;
        k++
      ){

        AtA[j][k]+=
          A[i][j]*
          A[i][k];
      }
    }
  }

  return solveLinear(
    AtA,
    Atb
  );
}


function applyHomography(
  h,
  p
){

  if(!h)
    return p;

  const denominator=
    h[6]*p.x+
    h[7]*p.y+
    1;

  if(
    Math.abs(
      denominator
    )<1e-10
  ){

    return p;
  }

  return{

    x:
      (
        h[0]*p.x+
        h[1]*p.y+
        h[2]
      )/
      denominator,

    y:
      (
        h[3]*p.x+
        h[4]*p.y+
        h[5]
      )/
      denominator
  };
}

   PUNTOS DE CALIBRACIÓN
   ========================================================= */

function getCalibrationTargets(){

  const w=
    canvas.clientWidth;

  const h=
    canvas.clientHeight;

  return[

    {
      x:w*.10,
      y:h*.10
    },

    {
      x:w*.90,
      y:h*.10
    },

    {
      x:w*.90,
      y:h*.90
    },

    {
      x:w*.10,
      y:h*.90
    },

    {
      x:w*.50,
      y:h*.50
    }

  ];
}


function showCalibrationTarget(){

  if(targetElement){

    targetElement.remove();

    targetElement=null;
  }

  const targets=
    getCalibrationTargets();

  const target=
    targets[
      calibrationTargetIndex
    ];

  targetElement=
    document.createElement(
      "div"
    );

  targetElement.className=
    "target";

  targetElement.style.left=
    target.x+"px";

  targetElement.style.top=
    target.y+"px";

  stage.appendChild(
    targetElement
  );
}


function startCalibration(){

  if(!objectModel){

    setMessage(
      "Primero aprende el objeto."
    );

    return;
  }

  calibrationMode=true;

  calibrationPoints=[];

  calibrationTargetIndex=0;

  capturePointBtn.classList.remove(
    "hidden"
  );

  calibrationBtn.textContent=
    "🎯 CALIBRACIÓN EN CURSO";

  showCalibrationTarget();

  setMessage(
    "🎯 Lleva la punta al círculo y captura el punto."
  );

  details.textContent=
    "Punto 1 de 5.";
}


function captureCalibrationPoint(){

  if(!calibrationMode)
    return;

  if(!previousTip){

    setMessage(
      "No estoy viendo la punta."
    );

    return;
  }

  const targets=
    getCalibrationTargets();

  const target=
    targets[
      calibrationTargetIndex
    ];

  calibrationPoints.push({

    src:{
      x:previousTip.x,
      y:previousTip.y
    },

    dst:{
      x:target.x,
      y:target.y
    }

  });

  calibrationTargetIndex++;

  if(
    calibrationTargetIndex>=5
  ){

    finishCalibration();

    return;
  }

  showCalibrationTarget();

  setMessage(
    "📍 Punto capturado."
  );

  details.textContent=
    "Punto "+
    (calibrationTargetIndex+1)+
    " de 5.";
}


function finishCalibration(){

  const src=
    calibrationPoints.map(
      p=>p.src
    );

  const dst=
    calibrationPoints.map(
      p=>p.dst
    );

  const h=
    fitHomography(
      src,
      dst
    );

  if(!h){

    setMessage(
      "❌ No se pudo calcular la calibración."
    );

    return;
  }

  homography=h;

  calibrationMode=false;

  capturePointBtn.classList.add(
    "hidden"
  );

  calibrationBtn.textContent=
    "🎯 CALIBRAR PANTALLA · 5 PUNTOS";

  if(targetElement){

    targetElement.remove();

    targetElement=null;
  }

  saveProfile();

  const error=
    calibrationError(
      h,
      src,
      dst
    );

  setMessage(
    "✅ Pantalla calibrada."
  );

  details.textContent=
    "Calibración guardada. Error medio: "+
    error.toFixed(1)+
    " px.";
}


function calibrationError(
  h,
  src,
  dst
){

  let sum=0;

  for(
    let i=0;
    i<src.length;
    i++
  ){

    const p=
      applyHomography(
        h,
        src[i]
      );

    sum+=
      distance(
        p,
        dst[i]
      );
  }

  return sum/src.length;
}


/* =========================================================
   PUNTERO
   ========================================================= */

function updatePointer(tip){

  let p=tip;

  if(homography){

    p=
      applyHomography(
        homography,
        tip
      );
  }

  const w=
    canvas.clientWidth;

  const h=
    canvas.clientHeight;

  p.x=
    clamp(
      p.x,
      0,
      w
    );

  p.y=
    clamp(
      p.y,
      0,
      h
    );

  pointer.style.left=
    p.x+"px";

  pointer.style.top=
    p.y+"px";

  pointer.classList.remove(
    "hidden"
  );
}


/* =========================================================
   GESTOS BÁSICOS
   ========================================================= */

function processBasicGesture(
  tip,
  angle
){

  const now=
    performance.now();

  if(!previousTip){

    previousTip={
      ...tip
    };

    previousTime=now;

    previousAngle=angle;

    return;
  }

  const dt=
    (now-previousTime)/1000;

  if(dt<=0)
    return;

  const dx=
    tip.x-
    previousTip.x;

  const dy=
    tip.y-
    previousTip.y;

  const speed=
    Math.hypot(
      dx,
      dy
    )/dt;

  if(
    speed>170 &&
    now-lastGestureTime>450
  ){

    let g="";

    if(
      Math.abs(dx)>
      Math.abs(dy)
    ){

      g=
        dx>0
        ? "➡️ DERECHA"
        : "⬅️ IZQUIERDA";

    }else{

      g=
        dy>0
        ? "⬇️ ABAJO"
        : "⬆️ ARRIBA";
    }

    gesture.textContent=g;

    lastGestureTime=now;

    if(
      navigator.vibrate
    ){

      navigator.vibrate(45);
    }
  }


  if(
    previousAngle!==null
  ){

    const da=
      angleDiff(
        angle,
        previousAngle
      );

    if(
      Math.abs(da)>.28 &&
      speed<650 &&
      now-lastGestureTime>600
    ){

      gesture.textContent=
        da>0
        ? "↻ ROTACIÓN"
        : "↺ ROTACIÓN";

      lastGestureTime=now;
    }
  }


  previousTip={
    ...tip
  };

  previousTime=now;

  previousAngle=angle;
}


/* =========================================================
   GESTOS PERSONALIZADOS
   ========================================================= */

function resamplePath(
  points,
  n=32
){

  if(points.length<2)
    return points;

  const pts=
    points.map(
      p=>({
        x:p.x,
        y:p.y
      })
    );

  let total=0;

  for(
    let i=1;
    i<pts.length;
    i++
  ){

    total+=
      distance(
        pts[i-1],
        pts[i]
      );
  }

  if(total===0)
    return pts;

  const interval=
    total/(n-1);

  const result=[
    pts[0]
  ];

  let D=0;

  let i=1;

  while(
    i<pts.length
  ){

    const d=
      distance(
        pts[i-1],
        pts[i]
      );

    if(
      D+d>=interval
    ){

      const t=
        (interval-D)/d;

      const q={
        x:
          pts[i-1].x+
          t*
          (pts[i].x-
           pts[i-1].x),

        y:
          pts[i-1].y+
          t*
          (pts[i].y-
           pts[i-1].y)
      };

      result.push(q);

      pts.splice(
        i,
        0,
        q
      );

      D=0;

    }else{

      D+=d;

      i++;
    }

    if(result.length>=n)
      break;
  }

  while(
    result.length<n
  ){

    result.push(
      pts[
        pts.length-1
      ]
    );
  }

  return result.slice(
    0,
    n
  );
}


function normalizePath(
  points
){

  const pts=
    resamplePath(
      points,
      32
    );

  if(pts.length<2)
    return [];

  let minX=Infinity;
  let maxX=-Infinity;

  let minY=Infinity;
  let maxY=-Infinity;

  for(const p of pts){

    minX=
      Math.min(
        minX,
        p.x
      );

    maxX=
      Math.max(
        maxX,
        p.x
      );

    minY=
      Math.min(
        minY,
        p.y
      );

    maxY=
      Math.max(
        maxY,
        p.y
      );
  }

  const width=
    Math.max(
      1,
      maxX-minX
    );

  const height=
    Math.max(
      1,
      maxY-minY
    );

  const scale=
    Math.max(
      width,
      height
    );

  const cx=
    pts.reduce(
      (s,p)=>s+p.x,
      0
    )/pts.length;

  const cy=
    pts.reduce(
      (s,p)=>s+p.y,
      0
    )/pts.length;

  return pts.map(
    p=>({

      x:
        (p.x-cx)/scale,

      y:
        (p.y-cy)/scale

    })
  );
}


function pathDistance(
  a,
  b
){

  const n=
    Math.min(
      a.length,
      b.length
    );

  if(!n)
    return Infinity;

  let sum=0;

  for(
    let i=0;
    i<n;
    i++
  ){

    sum+=
      Math.hypot(
        a[i].x-b[i].x,
        a[i].y-b[i].y
      );
  }

  return sum/n;
}


function recognizeCustomGesture(
  path
){

  if(
    customGestures.length===0 ||
    path.length<10
  )
    return;

  const normalized=
    normalizePath(
      path
    );

  let best=null;

  let bestDistance=
    Infinity;

  for(
    const g of customGestures
  ){

    const d=
      pathDistance(
        normalized,
        g.template
      );

    if(
      d<bestDistance
    ){

      bestDistance=d;
      best=g;
    }
  }

  /*
   * Umbral conservador.
   * Cuanto menor, más parecido debe ser.
   */

  if(
    best &&
    bestDistance<.28
  ){

    gesture.textContent=
      "🧠 "+
      best.name;

    executeAction(
      best.action
    );
  }
}


function startRecording(){

  if(!objectModel){

    setMessage(
      "Primero aprende el objeto."
    );

    return;
  }

  recordingGesture=true;

  recordedPath=[];

  recordingStart=
    performance.now();

  recordGestureBtn.textContent=
    "⏹️ DETENER GRABACIÓN";

  setMessage(
    "🔴 Grabando gesto..."
  );

  details.textContent=
    "Haz el movimiento y pulsa detener.";
}


function stopRecording(){

  recordingGesture=false;

  recordGestureBtn.textContent=
    "🔴 GRABAR GESTO";

  if(
    recordedPath.length<10
  ){

    setMessage(
      "⚠️ Gesto demasiado corto."
    );

    return;
  }

  const name=
    gestureName.value.trim() ||
    "Gesto "+(
      customGestures.length+1
    );

  const action=
    customAction.value;

  const template=
    normalizePath(
      recordedPath
    );

  customGestures.push({

    name:name,

    action:action,

    template:template
  });

  saveProfile();

  updateCustomGestureInfo();

  setMessage(
    "🧠 Gesto «"+
    name+
    "» guardado."
  );
}


function updateCustomGestureInfo(){

  if(
    customGestures.length===0
  ){

    customGestureInfo.textContent=
      "Todavía no hay gestos personalizados.";

    return;
  }

  customGestureInfo.textContent=
    "Guardados: "+
    customGestures
      .map(
        g=>g.name
      )
      .join(
        " · "
      );
}


/* =========================================================
   ACCIONES
   ========================================================= */

function executeAction(
  action
){

  if(action==="siguiente"){

    gesture.textContent=
      "⏭️ SIGUIENTE";

    /*
     * Preparado para futuro puente Android.
     */

    if(
      window.GestureWandBridge &&
      window.GestureWandBridge.siguiente
    ){

      window.GestureWandBridge.siguiente();
    }

    return;
  }


  if(action==="anterior"){

    gesture.textContent=
      "⏮️ ANTERIOR";

    if(
      window.GestureWandBridge &&
      window.GestureWandBridge.anterior
    ){

      window.GestureWandBridge.anterior();
    }

    return;
  }


  if(action==="reiniciar"){

    previousTip=null;
    previousEnds=null;

    gesture.textContent=
      "🔄 REINICIADO";

    return;
  }


  gesture.textContent=
    "⚡ ACCIÓN";
}


/* =========================================================
   SENSORES
   ========================================================= */

async function activateSensors(){

  try{

    if(
      typeof DeviceMotionEvent!=="undefined" &&
      typeof DeviceMotionEvent.requestPermission==="function"
    ){

      const permission=
        await DeviceMotionEvent
        .requestPermission();

      if(
        permission!=="granted"
      ){

        setMessage(
          "⚠️ Permiso de movimiento no concedido."
        );

        return;
      }
    }


    if(
      typeof DeviceOrientationEvent!=="undefined" &&
      typeof DeviceOrientationEvent.requestPermission==="function"
    ){

      const permission=
        await DeviceOrientationEvent
        .requestPermission();

      if(
        permission!=="granted"
      ){

        setMessage(
          "⚠️ Permiso de orientación no concedido."
        );

        return;
      }
    }


    window.addEventListener(
      "devicemotion",
      handleMotion
    );

    window.addEventListener(
      "deviceorientation",
      handleOrientation
    );

    sensorsActive=true;

    sensorBtn.textContent=
      "📱 SENSORES ACTIVOS";

    setMessage(
      "📱 Sensores activos."
    );

    saveProfile();

  }catch(err){

    console.error(err);

    setMessage(
      "❌ No se pudieron activar los sensores."
    );
  }
}


function handleMotion(event){

  const a=
    event.accelerationIncludingGravity;

  if(!a)
    return;

  sensorState.ax=
    a.x||0;

  sensorState.ay=
    a.y||0;

  sensorState.az=
    a.z||0;

  updateSensorDisplay();

  const magnitude=
    Math.hypot(
      sensorState.ax,
      sensorState.ay,
      sensorState.az
    );

  /*
   * Detección sencilla de SHAKE.
   */

  if(
    magnitude>18 &&
    performance.now()-lastGestureTime>700
  ){

    gesture.textContent=
      "📳 SHAKE";

    lastGestureTime=
      performance.now();

    if(
      navigator.vibrate
    ){

      navigator.vibrate(
        [40,30,40]
      );
    }
  }
}


function handleOrientation(event){

  sensorState.alpha=
    event.alpha||0;

  sensorState.beta=
    event.beta||0;

  sensorState.gamma=
    event.gamma||0;

  updateSensorDisplay();
}


function updateSensorDisplay(){

  sensorData.innerHTML=

    "Aceleración: "+
    sensorState.ax.toFixed(1)+
    " / "+
    sensorState.ay.toFixed(1)+
    " / "+
    sensorState.az.toFixed(1)+
    "<br>"+

    "Orientación: "+
    sensorState.alpha.toFixed(1)+
    " / "+
    sensorState.beta.toFixed(1)+
    " / "+
    sensorState.gamma.toFixed(1);
}


/* =========================================================
   DIBUJAR
   ========================================================= */

function drawCandidate(
  candidate,
  ends
){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  if(!candidate)
    return;

  ctx.beginPath();

  ctx.moveTo(
    ends.A.x,
    ends.A.y
  );

  ctx.lineTo(
    ends.B.x,
    ends.B.y
  );

  ctx.lineWidth=3;

  ctx.strokeStyle=
    "#00ff88";

  ctx.stroke();


  for(
    const point of [
      ends.A,
      ends.B
    ]
  ){

    ctx.beginPath();

    ctx.arc(
      point.x,
      point.y,
      9,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
      "#ffffff";

    ctx.fill();
  }


  const active=
    selectedTip==="A"
    ? ends.A
    : ends.B;

  ctx.beginPath();

  ctx.arc(
    active.x,
    active.y,
    17,
    0,
    Math.PI*2
  );

  ctx.strokeStyle=
    "#00ff88";

  ctx.lineWidth=3;

  ctx.stroke();


  if(
    homography
  ){

    const mapped=
      applyHomography(
        homography,
        active
      );

    ctx.beginPath();

    ctx.arc(
      mapped.x,
      mapped.y,
      7,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
      "#00aaff";

    ctx.fill();
  }
}


/* =========================================================
   BUCLE PRINCIPAL
   ========================================================= */

function scan(){

  if(!running)
    return;

  if(
    video.readyState>=2 &&
    video.videoWidth>0
  ){

    canvas.width=
      video.clientWidth;

    canvas.height=
      video.clientHeight;

    if(background){

      const mask=
        createMask();

      if(mask){

        const candidates=
          findCandidates(
            mask
          );

        const candidate=
          chooseCandidate(
            candidates
          );

        if(candidate){

          const ends=
            stabilizeEnds(
              candidate
            );

          previousEnds=ends;

          drawCandidate(
            candidate,
            ends
          );


          const tip=
            selectedTip==="A"
            ? ends.A
            : ends.B;

          processBasicGesture(
            tip,
            Math.atan2(
              ends.B.y-ends.A.y,
              ends.B.x-ends.A.x
            )
          );


          updatePointer(
            tip
          );


          /*
           * GRABACIÓN DE GESTO
           */

          if(recordingGesture){

            recordedPath.push({
              x:tip.x,
              y:tip.y
            });

            lastStrokeTime=
              performance.now();

            if(
              performance.now()-
              recordingStart>
              10000
            ){

              stopRecording();
            }
          }


          /*
           * RECONOCIMIENTO DE
           * GESTOS PERSONALIZADOS
           */

          if(
            !recordingGesture
          ){

            liveStroke.push({
              x:tip.x,
              y:tip.y
            });

            clearTimeout(
              strokeTimer
            );

            strokeTimer=
              setTimeout(
                ()=>{

                  if(
                    liveStroke.length>12
                  ){

                    recognizeCustomGesture(
                      liveStroke
                    );
                  }

                  liveStroke=[];

                },
                650
              );
          }


          details.textContent=
            "Forma "+
            candidate.aspect
              .toFixed(1)+
            "× · Longitud "+
            Math.round(
              candidate.length
            )+
            " · "+
            (
              homography
              ? "Puntero calibrado"
              : "Puntero sin calibrar"
            );

        }else{

          ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
          );

          pointer.classList.add(
            "hidden"
          );
        }
      }
    }
  }

  requestAnimationFrame(
    scan
  );
}

  "click",

);

tipABtn.addEventListener(
  "click",
  ()=>selectTip("A")
);

tipBBtn.addEventListener(
  "click",
  ()=>selectTip("B")
);

calibrationBtn.addEventListener(
  "click",
  startCalibration
);

capturePointBtn.addEventListener(
  "click",
  captureCalibrationPoint
);

sensorBtn.addEventListener(
  "click",
  activateSensors
);

resetBtn.addEventListener(
  "click",
  resetAll
);

recordGestureBtn.addEventListener(
  "click",
  ()=>{

    if(recordingGesture)
      stopRecording();
    else
      startRecording();

  }
);

clearGesturesBtn.addEventListener(
  "click",
  ()=>{

    customGestures=[];

    saveProfile();

    updateCustomGestureInfo();

    setMessage(
      "🗑️ Gestos personalizados borrados."
    );
  }
);


/* =========================================================
   INICIO
   ========================================================= */

const profileLoaded=
  loadProfile();

if(profileLoaded){

  setMessage(
    "💾 Perfil Gesture Wand recuperado."
  );

  details.textContent=
    "La configuración anterior está guardada. Captura el fondo para iniciar.";
}

updateTipButtons();

updateCustomGestureInfo();

</script>

</body>
</html>
